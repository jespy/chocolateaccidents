<style>
:root{--bg:#100b08;--panel:#21160f;--panel2:#2c1d14;--line:#684733;--ink:#fff4e7;--muted:#cdb79f;--gold:#ffd15c;--green:#72d69a;--red:#ef7168}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#312117,#0d0907 65%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;height:100vh;overflow:hidden}button,input,textarea,select{font:inherit}.app{height:100%;display:grid;grid-template-columns:310px 1fr}.sidebar{background:#17100d;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}.brand{padding:18px;border-bottom:1px solid var(--line)}.brand h1{font-size:20px;margin:0}.brand h1 span{color:var(--gold)}.brand p{margin:6px 0 0;color:var(--muted);font-size:12px}.tools{padding:12px;border-bottom:1px solid #3b291e;display:grid;gap:8px}.row{display:flex;gap:8px}.row>*{flex:1}.search,input,textarea,select{width:100%;background:#0f0a07;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px}.roomList{overflow:auto;padding:8px}.roomBtn{width:100%;display:flex;justify-content:space-between;align-items:center;background:transparent;color:var(--ink);border:1px solid transparent;padding:9px 10px;border-radius:9px;cursor:pointer;text-align:left}.roomBtn:hover,.roomBtn.active{background:#342219;border-color:#65442f}.roomBtn small{color:var(--muted)}button{background:#3a271c;color:var(--ink);border:1px solid #765239;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer}button:hover{background:#503524}.primary{background:#8b5128;border-color:#d18a48}.danger{color:#ffc0bb}.main{overflow:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:16px}.top h2{margin:0}.top p{margin:4px 0 0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,minmax(300px,1fr));gap:14px}.taskCard{background:linear-gradient(145deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:0 10px 30px #0004}.badge{display:inline-block;color:#2b1a0f;background:var(--gold);border-radius:99px;padding:3px 8px;font-size:10px;font-weight:900;text-transform:uppercase}.taskCard h3{margin:9px 0 5px}.taskCard p{margin:0;color:var(--muted);font-size:13px;min-height:38px}.cardBtns{display:flex;gap:7px;margin-top:13px}.cardBtns button{flex:1}.completed{border-color:#37835a}.completed h3:after{content:' ✓';color:var(--green)}dialog{width:min(760px,94vw);max-height:92vh;background:linear-gradient(#2d1e15,#1c130e);color:var(--ink);border:1px solid #80583d;border-radius:16px;padding:0;box-shadow:0 25px 90px #000}dialog::backdrop{background:#050302d9}.modalHead{padding:18px 20px 10px;border-bottom:1px solid #493122}.modalBody{padding:18px 20px}.modalHead h2{margin:0}.modalHead p{margin:5px 0;color:var(--muted)}.game{background:#120c09;border:1px solid #5f402d;border-radius:13px;padding:18px;min-height:190px}.progress{height:24px;background:#080604;border:1px solid var(--line);border-radius:99px;position:relative;margin:25px 0 13px;overflow:visible}.fill{height:100%;width:0;background:linear-gradient(90deg,#ffcd62,#ef894d);border-radius:99px}.zone{position:absolute;left:45%;width:20%;height:100%;top:0;background:#5acb8059;border-left:2px solid #8df1ae;border-right:2px solid #8df1ae}.zone:before,.zone:after{position:absolute;top:-23px;font-size:9px;color:#fff0ac;font-weight:900}.zone:before{content:'LOW';left:-13px}.zone:after{content:'HIGH';right:-16px}.needle{position:absolute;top:-5px;height:34px;width:5px;background:#fff06b;left:0;box-shadow:0 0 8px #fff06b}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.actions button{min-width:105px}.tip{text-align:center;color:var(--muted);font-size:12px;margin:12px 0 0}.result{text-align:center;font-size:24px;font-weight:900;padding:20px}.success{color:var(--green)}.fail{color:var(--red)}.modalFoot{display:flex;gap:8px;padding:0 20px 18px}.modalFoot button{flex:1}.editor{display:grid;grid-template-columns:1fr 1fr;gap:1 <body><div class="app"><aside class="sidebar"><div class="brand"><h1>🍫 <span>Chocolate Accidents</span></h1><p>Task Lab — isolated from the main game</p></div><div class="tools"><input id="search" class="search" placeholder="Search tasks…"><div class="row"><button id="testRoom">Test Room</button><button id="resetProgress">Reset</button></div><div class="row"><button id="exportBtn">Export JSON</button><button id="importBtn">Import JSON</button></div><input id="fileInput" type="file" accept="application/json" hidden></div><nav class="roomList" id="roomList"></nav></aside><main class="main"><div class="top"><div><h2 id="roomTitle"></h2><p id="roomSubtitle"></p></div><div class="row" style="flex:0 0 auto"><button class="primary" id="addTask">＋ Add Task</button><button class="primary" id="testAll">▶ Test All Tasks</button></div></div><section class="cards" id="cards"></section></main></div>
<dialog id="playDialog"><div class="modalHead"><span class="badge" id="playRoom"></span><h2 id="playTitle"></h2><p id="playDesc"></p></div><div class="modalBody"><div class="game" id="game"></div></div><div class="modalFoot"><button id="restartTask">Restart Task</button><button id="skipTask">Skip</button><button id="closePlay">Close</button></div></dialog>
<dialog id="editDialog"><div class="modalHead"><h2>Edit task</h2><p>Changes save locally and can be exported as JSON.</p></div><div class="modalBody"><div class="editor"><label class="wide">Task name<input id="editName"></label><label class="wide">Instructions<textarea id="editDesc"></textarea></label><label>Mini-game type<select id="editType"><option value="sequence">Sequence</option><option value="timing">Timing scan</option><option value="sort">Sort items</option><option value="choice">Inspect / choose</option><option value="clicker">Repetitive clicking</option><option value="memory">Memory buttons</option><option value="hold">Hold control</option></select></label><label>Difficulty (1–5)<input id="editDifficulty" type="number" min="1" max="5"></label><label class="wide">Buttons/categories (separate with |)<input id="editItems"></label><label class="wide">Task-specific objects or situations (separate with |)<textarea id="editPrompts"></textarea></label><label class="wide">Correct feedback | Incorrect feedback<input id="editFeedback"></label><div class="wide" id="choiceOptions" style="padding:12px;border:1px solid #5f402d;border-radius:10px;background:#160f0b"><b>Inspect / Choose answer rules</b><div class="editor" style="margin-top:9px"><label>Normal right answer<input id="editRightAnswer"></label><label>Normal wrong answer<input id="editWrongAnswer"></label><label class="wide" style="display:flex;align-items:center;gap:9px;color:var(--ink)"><input id="editRandomizeAnswers" type="checkbox" style="width:auto"> Randomly swap which answer is correct during the task</label><label class="wide">Formerly right answer is now wrong<input id="editRuleChanged" value="Renee has changed the process. Try again."></label><label class="wide">Formerly wrong answer is now right<input id="editWrongBecameRight" value="Wow, are you running my company now?"></label></div></div><label class="wide">Completion message<input id="editSuccess"></label></div><p class="note">The Inspect / Choose settings define the normal correct answer and optionally let Renee change the rule between rounds.</p></div><div class="modalFoot"><button class="primary" id="saveEdit">Save Changes</button><button id="cancelEdit">Cancel</button></div></dialog>
<script>
const seed=[
['Shipping',[['Count the Same Boxes Again','Count the shipment Renee already counted twice.','clicker','COUNT BOX'],['Reprint a Perfectly Good Label','Perform the approved label replacement procedure.','sequence','PEEL OLD|PRINT SAME|APPLY NEW'],['Sort Boxes by Vibes','Assign each identical box a completely subjective shipping mood.','sort','URGENT-ISH|REGULAR-ISH|MYSTERIOUS'],['Confirm the Tape Is Sticky','Test five pieces of tape and record the obvious result.','choice','STICKY|NOT STICKY']]],
['Fancy Packaging',[['Fluff the Tissue Paper','Click repeatedly until the tissue is management-approved fluffy.','clicker','FLUFF'],['Untangle Decorative Ribbon','Follow the ribbon steps without asking why it was stored this way.','sequence','FIND END|UNTWIST|RETWIST NICELY'],['Rank Bows by Fanciness','Sort bows into arbitrary levels of fancy.','sort','FANCY|FANCIER|TOO FANCY'],['Rebox the Display Box','Put the empty display box into another display box.','memory','OPEN|NEST|CLOSE']]],
['Walk-In / Freezer',[['Count Individual Chocolate Chips','Scan three tiny inventory zones before your fingers freeze.','timing','STOP SCAN'],['Check If the Freezer Is Cold','Inspect five readings and confirm that cold is cold.','choice','COLD|SUSPICIOUSLY WARM'],['Alphabetize Frozen Labels','Sort invented flavor names while standing in a freezer.','sort','ARCTIC ALMOND|BRISK BRITTLE|CHILLY CHERRY'],['Hold the Door Almost Closed','Hold the meter in the approved mostly-closed zone.','hold','HOLD DOOR']]],
['Production',[['Watch the Conveyor Convey','Acknowledge every box that passes the inspection line.','clicker','ACKNOWLEDGE'],['Remove Chocolates That Look Too Confident','Judge five chocolates using Renee’s newest quality standard.','choice','HUMBLE|TOO CONFIDENT'],['Restart the Machine That Is Running','Complete the unnecessary restart sequence.','sequence','STOP|WAIT|START'],['Synchronize the Blinking Lights','Stop the scanner inside the acceptable blinking window.','timing','SYNC']]],
['Break Room',[['Refill the Already Full Cups','Add more cups without knocking over the existing cups.','clicker','ADD CUP'],['Clean the Clean Counter','Wipe, inspect, and wipe the clean counter again.','sequence','SPRAY|WIPE|WIPE AGAIN'],['Organize Sugar by Sweetness','Sort identical sugar packets by imaginary sweetness.','sort','SWEET|SWEETER|SUSPICIOUSLY SWEET'],['Make Coffee for Someone Who Left','Complete the coffee sequence after they have gone home.','memory','MUG|COFFEE|BREW']]],
['Reception',[['Straighten the Crooked Flyers','Correct four flyers; one will probably look crooked anyway.','timing','STRAIGHTEN'],['Ward Off Solicitors','Choose whether each visitor deserves precious lobby oxygen.','choice','SEND AWAY|LET THEM RAMBLE'],['Recount the Visitor Pens','Count the same pen cup until the number feels official.','clicker','COUNT PEN'],['Update the Welcome Sign','Change the greeting, approve it, then change it back.','sequence','EDIT|APPROVE|UNDO']]],
['Art Department',[['Make the Logo Bigger','Increase it, review it, then return almost to the original size.','sequence','BIGGER|EVEN BIGGER|SLIGHTLY SMALLER'],['Name Untitled Final Final Files','Sort confusing files into equally confusing folders.','sort','FINAL|FINAL 2|FINAL REAL'],['Nudge It Two Pixels Left','Stop the alignment needle in the zone nobody can see.','timing','NUDGE'],['Approve Random Shades of Brown','Judge five nearly identical chocolate colors.','choice','APPROVE|TOO BROWN']]],
["Boss's Office",[['Alphabetize Renee’s Sticky Notes','Sort notes labeled IMPORTANT, URGENT, and VERY URGENT.','sort','IMPORTANT|URGENT|VERY URGENT'],['Prepare for a Canceled Meeting','Set everything up in the required order.','sequence','PRINT AGENDA|ARRANGE CHAIRS|RECEIVE CANCELLATION'],['Count Clipboard Clips','Count every clip on every clipboard for compliance.','clicker','COUNT CLIP'],['Hold for Management Approval','Keep the approval request inside the waiting zone.','hold','KEEP WAITING']]],
['White Room',[['Temper the Canceled Order','Hold the temperature for chocolate nobody needs anymore.','hold','HEAT'],['Polish White Chocolate','Click until the imaginary shine rating reaches 100%.','clicker','POLISH'],['Separate White from Off-White','Classify five nearly indistinguishable samples.','choice','WHITE|OFF-WHITE'],['Perform the Purity Ritual','Complete the official room-entry button sequence.','memory','GLOVES|HAIRNET|NOD SERIOUSLY']]],
['Accounting Office',[['Match Mystery Receipts','Categorize receipts containing descriptions like “chocolate stuff.”','choice','BUSINESS|PROBABLY BUSINESS'],['Print the Digital Archive','Complete the paper-saving initiative by printing it all.','sequence','SELECT ALL|PRINT|ORDER MORE PAPER'],['Reconcile One Cent','Click until the spreadsheet agrees that one cent matters.','clicker','RECALCULATE'],['Enter the Printer Reset Code','Repeat the official accounting-office sequence.','memory','INK|IMAGE|PRINT']]],
['Chocolate Storage',[['Rotate Hidden Labels Forward','Face every case label outward, even those against the wall.','clicker','ROTATE CASE'],['Find the Box Renee Is Standing Beside','Scan the shelving until the obvious box becomes official.','timing','STOP SCAN'],['Sort Cocoa by Brownness','Arrange cases using increasingly vague brown categories.','sort','BROWN|BROWNER|BROWNEST'],['Verify Empty Shelf Capacity','Inspect five empty spaces and confirm they remain empty.','choice','EMPTY|ALSO EMPTY']]],
['Warehouse A',[['Count Pallets from a Different Angle','Recount the pallets because the first angle was unprofessional.','clicker','COUNT PALLET'],['Organize Boxes by Boxiness','Sort boxes using a measurement nobody defined.','sort','BOXISH|BOXIER|BOXIEST'],['Scan the Barcode under the Barcode','Stop the scanner precisely three times.','timing','STOP SCAN'],['Inspect the Inspection Stickers','Judge whether inspection stickers were sufficiently inspected.','choice','INSPECTED|INSPECT AGAIN']]],
['Warehouse B',[['Find the Missing Box','Inspect identical cases; the requested one was mislabeled.','choice','THIS ONE|NOT THIS ONE'],['Move Boxes Six Inches','Perform the approved micro-relocation procedure.','sequence','LIFT|MOVE 6 INCHES|SET DOWN'],['Count Emergency Bubble Wrap','Pop nothing. Just count every bubble repeatedly.','clicker','COUNT BUBBLE'],['Sort Dusty and Very Dusty','Categorize warehouse cases by highly scientific dust levels.','sort','DUSTY|VERY DUSTY|LEGENDARY DUST']]],
['Sales Office',[['Update Prices Then Change Them Back','Follow management’s complete pricing strategy.','sequence','RAISE PRICES|SEND EMAIL|RESTORE PRICES'],['Rank Leads by Chocolate Enthusiasm','Sort customer leads using enthusiasm instead of revenue.','sort','CURIOUS|EXCITED|UNCOMFORTABLY EXCITED'],['Call Someone Who Requested Email','Acknowledge five increasingly awkward call prompts.','clicker','LEAVE VOICEMAIL'],['Approve Impossible Delivery Dates','Judge requests without considering physics or calendars.','choice','PROMISE IT|PROMISE IT LOUDER']]],
['Control Room',[['Acknowledge Normal Operation','Dismiss alerts announcing that nothing is wrong.','clicker','ACKNOWLEDGE'],['Recalibrate the Recalibration Button','Complete the recalibration loop in order.','sequence','CALIBRATE|VERIFY|RECALIBRATE'],['Sort Alarms by Annoyingness','Rank identical beeps using personal irritation.','sort','ANNOYING|MORE ANNOYING|RENEE LEVEL'],['Hold the Meaningless Dial Steady','Keep a decorative dial in its official green range.','hold','HOLD DIAL']]]
];
const flavor={
'Count the Same Boxes Again':['Box marked 14 (possibly 41)|Box with old coffee ring|Box Renee counted as two|Box hiding behind a larger box|Box labeled DO NOT COUNT|The box you started with','The tally sheet reluctantly accepts that number.|Renee says that count feels emotionally incorrect.'],
'Sort Boxes by Vibes':['Box humming faintly|Box with confident tape|Box that arrived unannounced|Box facing the wall|Box containing another box|Box everyone avoids eye contact with','The box has been assigned a legally meaningless vibe.|That vibe conflicts with Shipping Policy 4-B, which does not exist.'],
'Confirm the Tape Is Sticky':['Tape stuck to the dispenser|Tape stuck to itself|Tape stuck to Chris|Tape covered in cardboard fuzz|Tape that makes no attempt to stick|Tape Renee called “premium”','Your conclusion agrees with the obvious physical evidence.|Renee peels it off the desk and asks you to reconsider.'],
'Rank Bows by Fanciness':['Tiny bow with enormous confidence|Gold bow shedding glitter everywhere|Crooked bow labeled artisan|Bow made from leftover ribbon|Perfect bow nobody ordered|Bow tied around an empty box','The bow accepts its social rank.|The bow has appealed your decision to Fancy Packaging.'],
'Check If the Freezer Is Cold':['Ice on the door handle|Thermometer reading 4°F|Chocolate frozen to the shelf|Visible breath cloud|Employee wearing three coats|Mysterious puddle that is somehow still frozen','Yes, that is convincingly cold.|The freezer responds with an offended mechanical hum.'],
'Alphabetize Frozen Labels':['Arctic Almond|Brisk Brittle|Chilly Cherry|Frigid Fudge|Polar Praline|Subzero Sprinkle','The label has been filed where no one will look for it.|The alphabet has rejected this placement.'],
'Remove Chocolates That Look Too Confident':['Piece standing slightly taller than the others|Truffle leaning into the spotlight|Bonbon with an unnecessary shine|Square hiding behind the rejects|Piece shaped exactly like management|Ordinary chocolate minding its business','Renee agrees with your unsupported personality assessment.|That chocolate was confident, not arrogant. There is apparently a difference.'],
'Organize Sugar by Sweetness':['Plain white packet|Packet labeled EXTRA SWEET|Brown sugar packet in disguise|Empty packet someone returned|Packet with one grain missing|Mystery sweetener from 2019','Sweetness ranking entered into the permanent record.|Your palate has failed the annual sugar calibration.'],
'Ward Off Solicitors':['Copier salesperson promising 73% savings|Water delivery representative carrying no water|Factory extended-warranty specialist|Office-supply salesperson with one pen|Energy auditor asking for forty-five minutes|Influencer requesting free truffles','Reception remains mercifully sales-pitch free.|They have unfolded a brochure. You may never escape.'],
'Approve Random Shades of Brown':['Cocoa Brown #7|Executive Espresso|Nearly Mahogany|Budget Ganache|Brown That Looked Different Upstairs|Pantone Probably Chocolate','The shade joins the approved wall of indistinguishable browns.|Art Department insists this brown has completely different energy.'],
"Alphabetize Renee’s Sticky Notes":['IMPORTANT|URGENT|VERY URGENT|ASK CHRIS|DO THIS|WHY IS THIS HERE','The note is now organized but no more understandable.|Renee says urgency should be sorted by “feel,” not spelling.'],
'Separate White from Off-White':['Bright white sample|Ivory sample under yellow light|White chocolate beside printer paper|Sample labeled CREAM-ISH|White sample with one cocoa crumb|Off-white sample Renee calls beige','The sample has received its official almost-white designation.|The White Room committee requests a whiter opinion.'],
'Match Mystery Receipts':['Receipt reading CHOCOLATE STUFF — $47|Lunch receipt circled IMPORTANT|Faded receipt with no total|Hardware-store receipt for one tiny screw|Receipt signed only “Renee”|Coffee receipt charged to Research','Accounting has accepted the expense with visible reluctance.|The receipt has been returned with three new forms attached.'],
'Sort Cocoa by Brownness':['Light cocoa case|Dark cocoa case|Case viewed under bad lighting|Case labeled MEDIUM-ISH|Cocoa powder spilled on another case|Box whose brownness is confidential','The cocoa has been assigned an authoritative shade of brown.|The storage lighting has overruled your eyes.'],
'Verify Empty Shelf Capacity':['Shelf containing absolutely nothing|Shelf with one forgotten label|Shelf reserved for future emptiness|Shelf someone photographed for proof|Empty space between two boxes|Shelf Renee says looks “too available”','The empty shelf is certified to contain zero boxes.|Accounting cannot approve emptiness without a physical sample.'],
'Organize Boxes by Boxiness':['Perfect cube pretending to be a box|Long carton with identity issues|Crushed box held together by optimism|Tiny box inside a huge box|Round tin visiting the warehouse|Box-shaped shadow with no box','Its boxiness rating has been entered into the warehouse ledger.|That object is apparently more box-adjacent than boxy.'],
'Inspect the Inspection Stickers':['Sticker applied upside down|Sticker inspecting another sticker|Sticker dated next Thursday|Blank sticker with a checkmark|Two stickers arguing over one box|Sticker placed directly over the barcode','The inspection sticker has passed its sticker inspection.|This sticker requires a supervising sticker.'],
'Find the Missing Box':['Box labeled NOT MISSING|Requested case directly behind Chris|Empty carton with the right barcode|Correct product in the wrong box|Wrong product in the correct box|Box Renee is currently leaning on','You found something close enough for Warehouse B.|The inventory system insists that box is in another building.'],
'Sort Dusty and Very Dusty':['Case with one fingerprint|Case wearing a gray dust blanket|Box recently wiped in one small circle|Pallet from the legendary back corner|Carton that makes Chris sneeze|Spotless box everyone distrusts','Dust level recorded. The dust itself remains in place.|Warehouse B requests a second dust opinion.'],
'Rank Leads by Chocolate Enthusiasm':['Customer requesting one sample|Bride ordering 400 favors|Caller who says “I just love chocolate” six times|Restaurant asking only for pricing|Person requesting a chocolate statue of themselves|Lead who opened the email accidentally','Sales has assigned the lead an enthusiasm level instead of calling them.|The lead used an exclamation point, invalidating your ranking.'],
'Approve Impossible Delivery Dates':['500 pieces needed tomorrow morning|Custom mold requested before artwork exists|Order due yesterday|Rush order shipping to an unknown address|Ten thousand truffles by lunch|Customer asking if “whenever” means today','Sales has promised it with confidence unsupported by time.|Try again—this office does not recognize the word impossible.'],
'Sort Alarms by Annoyingness':['Single polite beep|Continuous high-pitched chirp|Alarm that stops when approached|Warning tone identical to the microwave|Silent alarm flashing aggressively|Renee saying “Do you hear that?”','The alarm has been ranked and continues beeping.|Control Room says annoyance must be measured in Renees per minute.'],
'Fluff the Tissue Paper':['Flattened sheet from the bottom of the box|Sheet already fluffed by three employees|Tissue folded into an accidental swan|Piece with one unacceptable wrinkle|Paper Renee says lacks enthusiasm|Last sheet before lunch','The tissue is now 4% more emotionally supportive.|Fancy Packaging requests two additional fluffs.'],
'Watch the Conveyor Convey':['Carton enters from the left|Chocolate passes the exact center|Empty belt continues moving|Same carton returns somehow|Wrapper travels without chocolate|Conveyor performs its primary function','Conveyance officially witnessed.|You blinked. Production requires the observation again.'],
'Refill the Already Full Cups':['Add cup above the fill line|Squeeze cup into the second stack|Replace cup Chris just removed|Add tiny cup nobody uses|Restack leaning paper cups|Count lid as honorary cup','The cup station is now dangerously prepared.|That cup disrupted the approved tower silhouette.'],
'Recount the Visitor Pens':['Blue pen without cap|Cap without blue pen|Pen chained to nothing|Promotional pen from another company|Marker hiding among pens|Pencil Reception insists is a pen','The pen count has changed without any pens moving.|Reception requires a separate count of functional pens.'],
'Count Clipboard Clips':['Small silver clip|Large black clip|Clip holding no paper|Two clips clipped together|Bent clip marked DO NOT DISCARD|Clipboard with its clip missing','The clip ledger is one entry more complete.|Renee says attached clips and loose clips use different math.'],
'Polish White Chocolate':['Piece with thumbprint|Piece already reflecting the ceiling light|Scuffed sample from the reject tray|Chocolate slowly melting under the cloth|Display piece nobody will see|Piece Renee touched immediately after polishing','The shine has reached an unverifiable standard.|The reflection is insufficiently white.'],
'Reconcile One Cent':['Round line item down|Round it back up|Refresh formula|Reopen closed spreadsheet|Check calculator battery|Move penny into suspense account','Accounting is balanced until someone refreshes the sheet.|The penny has migrated to a different column.'],
'Rotate Hidden Labels Forward':['Case against the back wall|Label underneath the bottom case|Box already facing forward|Case visible only from the ceiling|Label covered by another label|Box nobody has opened since 2018','The label can now be seen by someone standing inside the shelf.|Chocolate Storage says forward means a different direction today.'],
'Count Pallets from a Different Angle':['Pallet viewed from north aisle|Same pallet viewed from south aisle|Half pallet counted as emotionally whole|Empty pallet beneath boxes|Stack casting two pallet-shaped shadows|Pallet Renee remembers but nobody can find','The new angle has produced the same controversial total.|Warehouse A suspects perspective fraud.'],
'Count Emergency Bubble Wrap':['Bubble beside the torn edge|Bubble already popped|Suspiciously large bubble|Tiny bubble inside another bubble|Row skipped by the previous counter|Bubble Chris accidentally leaned on','Emergency cushioning capacity has increased by zero.|A bubble popped during counting; restart that section.'],
'Call Someone Who Requested Email':['Dial customer who wrote PLEASE EMAIL|Leave voicemail explaining the email|Call again because voicemail sounded unsure|Record that no one answered|Email them to report the phone call|Schedule a follow-up call about the email','Sales activity logged; customer satisfaction unknown.|The voicemail lacked sufficient chocolate enthusiasm.'],
'Acknowledge Normal Operation':['Green light reports NORMAL|Screen announces NO ERRORS|Alarm confirms alarm is available|Temperature reads exactly its setting|System reports successful report|Popup asks whether everything is still fine','Normal operation has been formally acknowledged.|Control Room needs verbal confirmation from the green light.']};
const defaultTasks=seed.flatMap(([room,arr])=>arr.map((a,i)=>{const f=flavor[a[0]]||['','',''],answers=a[3].split('|');return {id:room.toLowerCase().replace(/\W/g,'-')+'-'+(i+1),room,name:a[0],desc:a[1],type:a[2],items:a[3],prompts:f[0]||a[0],feedback:f[1]||'That strangely counts as progress.|Renee has requested another attempt.',rightAnswer:answers[0]||'RIGHT',wrongAnswer:answers[1]||'WRONG',randomizeAnswers:false,ruleChangedMessage:'Renee has changed the process. Try again.',wrongBecameRightMessage:'Wow, are you running my company now?',difficulty:2,success:'Busywork complete. Productivity remains unchanged.'}}));
const stored=JSON.parse(localStorage.getItem('ca-task-lab')||'null');let tasks=stored?stored.map(t=>Object.assign({},defaultTasks.find(d=>d.id===t.id)||{},t)):structuredClone(defaultTasks),activeRoom=seed[0][0],activeTask=null,editTask=null,queue=[],anim=0,state={};
const $=s=>document.querySelector(s),rooms=seed.map(x=>x[0]);
function save(){localStorage.setItem('ca-task-lab',JSON.stringify(tasks))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderRooms(){const q=$('#search').value.toLowerCase();$('#roomList').innerHTML=rooms.map(r=>{const total=tasks.filter(t=>t.room===r).length,count=tasks.filter(t=>t.room===r&&(t.name+' '+t.desc).toLowerCase().includes(q)).length;return `<button class="roomBtn ${r===activeRoom?'active':''}" data-room="${esc(r)}"><span>${esc(r)}</span><small>${q?count+' / ':''}${total}</small></button>`}).join('');document.querySelectorAll('.roomBtn').forEach(b=>b.onclick=()=>{activeRoom=b.dataset.room;render()})}
function render(){renderRooms();const q=$('#search').value.toLowerCase(),shown=tasks.filter(t=>(activeRoom==='ALL'||t.room===activeRoom)&&(t.name+' '+t.desc+' '+t.room).toLowerCase().includes(q));$('#roomTitle').textContent=activeRoom==='ALL'?'All Tasks':activeRoom;$('#roomSubtitle').textContent=`${shown.length} task${shown.length===1?'':'s'} shown · ${tasks.length} total · edits stay inside the Task Lab`;$('#cards').innerHTML=shown.map(t=>`<article class="taskCard ${t.passed?'completed':''}"><span class="badge">${esc(t.type)} · difficulty ${t.difficulty}</span><h3>${esc(t.name)}</h3><p>${esc(t.desc)}</p><div class="cardBtns"><button class="primary play" data-id="${t.id}">Test</button><button class="edit" data-id="${t.id}">Edit</button><button class="danger delete" data-id="${t.id}">Delete</button></div></article>`).join('');document.querySelectorAll('.play').forEach(b=>b.onclick=()=>play(tasks.find(t=>t.id===b.dataset.id)));document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openEdit(tasks.find(t=>t.id===b.dataset.id)));document.querySelectorAll('.delete').forEach(b=>b.onclick=()=>deleteTask(tasks.find(t=>t.id===b.dataset.id)))}
function parts(t){return t.items.split('|').map(x=>x.trim()).filter(Boolean)}function progress(n){$('.fill').style.width=Math.max(0,Math.min(100,n))+'%'}function buttons(items,fn){return `<div class="actions">${items.map((x,i)=>`<button data-i="${i}">${esc(x)}</button>`).join('')}</div>`}
function play(t){activeTask=t;state={p:0};$('#playRoom').textContent=t.room;$('#playTitle').textContent=t.name;$('#playDesc').textContent=t.desc;$('#playDialog').showModal();buildCurrent()}
function taskPrompts(t){return String(t.prompts||t.name).split('|').map(x=>x.trim()).filter(Boolean)}function taskFeedback(t){const f=String(t.feedback||'That strangely counts as progress.|Renee has requested another attempt.').split('|');return [f[0],f[1]||f[0]]}
function buildCurrent(){activeTask.type==='choice'?buildChoice():build()}
function buildChoice(){cancelAnimationFrame(anim);const t=activeTask,g=$('#game'),it=parts(t),prompts=taskPrompts(t),fb=taskFeedback(t);state={p:0,target:Math.min(5,prompts.length)};g.innerHTML='<div class="progress"><div class="fill"></div></div><div id="inner"></div><p class="tip" id="tip">Choose using the current process. Renee may change it without warning.</p>';progress(0);const inner=$('#inner'),tip=$('#tip'),normalRight=t.rightAnswer||it[0]||'RIGHT',normalWrong=t.wrongAnswer||it[1]||'WRONG',answerButtons=[normalRight,normalWrong];const next=()=>{state.ruleFlipped=!!t.randomizeAnswers&&Math.random()<.5;state.correctAnswer=state.ruleFlipped?normalWrong:normalRight;inner.innerHTML=`<p style="text-align:center;font-weight:900">${esc(prompts[state.p%prompts.length])}</p>`+buttons(answerButtons);inner.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{const selected=answerButtons[i],correct=selected===state.correctAnswer;if(correct){state.p++;progress(state.p/state.target*100);tip.textContent=state.ruleFlipped?(t.wrongBecameRightMessage||'Wow, are you running my company now?'):fb[0]}else{tip.textContent=state.ruleFlipped&&selected===normalRight?(t.ruleChangedMessage||'Renee has changed the process. Try again.'):fb[1]}if(state.p>=state.target)finish();else setTimeout(next,650)})};next()}
function build(){cancelAnimationFrame(anim);const t=activeTask,g=$('#game'),it=parts(t),prompts=taskPrompts(t),fb=taskFeedback(t);g.innerHTML='<div class="progress"><div class="fill"></div></div><div id="inner"></div><p class="tip" id="tip"></p>';progress(0);const inner=$('#inner'),tip=$('#tip');if(t.type==='sequence'||t.type==='memory'){const seq=it;let order=t.type==='memory'?[...seq].sort(()=>Math.random()-.5):seq;tip.textContent=(t.type==='memory'?'Remember the task-specific sequence: '+seq.join(' → '):t.desc);inner.innerHTML=buttons(order);inner.querySelectorAll('button').forEach(b=>b.onclick=()=>{const val=order[+b.dataset.i];if(val===seq[state.p]){state.p++;b.disabled=true;progress(state.p/seq.length*100);state.p===seq.length&&finish()}else{state.p=0;progress(0);tip.textContent=fb[1]}})}else if(t.type==='clicker'){state.target=Math.min(prompts.length,5+t.difficulty*2);if(state.target<2)state.target=5+t.difficulty*2;tip.textContent=prompts[0];inner.innerHTML=buttons([it[0]||'DO BUSYWORK']);inner.querySelector('button').onclick=()=>{state.p++;progress(state.p/state.target*100);tip.textContent=state.p>=state.target?fb[0]:(prompts[state.p%prompts.length]||`${state.p}/${state.target}`);state.p>=state.target&&finish()}}else if(t.type==='sort'){state.target=Math.min(prompts.length,4+t.difficulty);tip.textContent='Assign each specific item to one of Renee’s official categories.';const next=()=>{inner.innerHTML=`<p style="text-align:center;font-weight:900">${esc(prompts[state.p%prompts.length])}</p>`+buttons(it);inner.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.p++;progress(state.p/state.target*100);tip.textContent=fb[0];state.p>=state.target?finish():next()})};next()}else if(t.type==='choice'){state.target=Math.min(5,prompts.length);tip.textContent='Apply the two available decisions to these very specific situations.';const next=()=>{const good=Math.random()>.42;state.good=good;inner.innerHTML=`<p style="text-align:center;font-weight:900">${esc(prompts[state.p%prompts.length])}</p>`+buttons(it.slice(0,2));inner.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{const correct=(i===0)===good;state.p=correct?state.p+1:Math.max(0,state.p-1);progress(state.p/state.target*100);tip.textContent=correct?fb[0]:fb[1];state.p>=state.target?finish():setTimeout(next,350)})};next()}else if(t.type==='timing'){state.pos=0;state.dir=1;state.hits=0;$('.progress').innerHTML='<div class="zone"></div><div class="needle"></div>';inner.innerHTML=buttons([it[0]||'STOP']);tip.textContent=prompts[0]||'Stop inside the marked zone three times. Spacebar also works.';state.stop=()=>{if(state.pos>=45&&state.pos<=65){state.hits++;tip.textContent=`${fb[0]} (${state.hits}/3)`;if(state.hits>=3)return finish()}else tip.textContent=`${fb[1]} (${state.hits}/3)`};inner.querySelector('button').onclick=state.stop;let last=performance.now();const tick=n=>{const dt=(n-last)/1000;last=n;state.pos+=state.dir*80*dt;if(state.pos>100){state.pos=100;state.dir=-1}if(state.pos<0){state.pos=0;state.dir=1}const needle=$('.needle');if(needle)needle.style.left=`calc(${state.pos}% - 2px)`;anim=requestAnimationFrame(tick)};anim=requestAnimationFrame(tick)}else if(t.type==='hold'){state.level=15;state.held=false;state.good=0;$('.progress').innerHTML='<div class="zone"></div><div class="needle"></div>';inner.innerHTML=buttons([it[0]||'HOLD']);tip.textContent=prompts[0]||t.desc;const b=inner.querySelector('button');b.onpointerdown=e=>{e.preventDefault();state.held=true};b.onpointerup=b.onpointerleave=()=>state.held=false;let last=performance.now();const tick=n=>{const dt=(n-last)/1000;last=n;state.level+=state.held?34*dt:-10*dt;state.level=Math.max(0,Math.min(100,state.level));if(state.level>=45&&state.level<=65)state.good+=25*dt;else state.good=Math.max(0,state.good-7*dt);const needle=$('.needle');if(needle)needle.style.left=`calc(${state.level}% - 2px)`;tip.textContent=`${state.level>=45&&state.level<=65?fb[0]:fb[1]} ${Math.round(state.good)}%`;if(state.good>=100)return finish();anim=requestAnimationFrame(tick)};anim=requestAnimationFrame(tick)}}
function finish(){cancelAnimationFrame(anim);activeTask.passed=true;save();$('#game').innerHTML=`<div class="result success">✓ ${esc(activeTask.success)}</div>`;setTimeout(()=>{if(queue.length){const next=queue.shift();play(next)}},650);render()}
function openEdit(t){editTask=t;$('#editName').value=t.name;$('#editDesc').value=t.desc;$('#editType').value=t.type;$('#editDifficulty').value=t.difficulty;$('#editItems').value=t.items;$('#editPrompts').value=t.prompts||'';$('#editFeedback').value=t.feedback||'';$('#editRightAnswer').value=t.rightAnswer||parts(t)[0]||'RIGHT';$('#editWrongAnswer').value=t.wrongAnswer||parts(t)[1]||'WRONG';$('#editRandomizeAnswers').checked=!!t.randomizeAnswers;$('#editRuleChanged').value=t.ruleChangedMessage||'Renee has changed the process. Try again.';$('#editWrongBecameRight').value=t.wrongBecameRightMessage||'Wow, are you running my company now?';$('#editSuccess').value=t.success;$('#choiceOptions').style.opacity=t.type==='choice'?'1':'.45';$('#editDialog').showModal()}
$('#editType').onchange=()=>$('#choiceOptions').style.opacity=$('#editType').value==='choice'?'1':'.45';
$('#saveEdit').onclick=()=>{Object.assign(editTask,{name:$('#editName').value.trim(),desc:$('#editDesc').value.trim(),type:$('#editType').value,difficulty:+$('#editDifficulty').value||2,items:$('#editItems').value.trim(),prompts:$('#editPrompts').value.trim(),feedback:$('#editFeedback').value.trim(),rightAnswer:$('#editRightAnswer').value.trim(),wrongAnswer:$('#editWrongAnswer').value.trim(),randomizeAnswers:$('#editRandomizeAnswers').checked,ruleChangedMessage:$('#editRuleChanged').value.trim(),wrongBecameRightMessage:$('#editWrongBecameRight').value.trim(),success:$('#editSuccess').value.trim()});save();$('#editDialog').close();render()};$('#cancelEdit').onclick=()=>$('#editDialog').close();$('#closePlay').onclick=()=>{cancelAnimationFrame(anim);queue=[];$('#playDialog').close()};$('#restartTask').onclick=buildCurrent;$('#skipTask').onclick=()=>{if(queue.length)play(queue.shift());else $('#playDialog').close()};
function newId(room){return room.toLowerCase().replace(/\W/g,'-')+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6)}
function addTask(){const room=activeRoom==='ALL'?rooms[0]:activeRoom;const task={id:newId(room),room,name:'New Busywork Task',desc:'Describe the unnecessarily important work Renee assigned.',type:'sequence',items:'STEP ONE|STEP TWO|UNDO STEP ONE',prompts:'First task-specific situation|Second task-specific situation|Third task-specific situation',feedback:'Renee accepts this for now.|Renee has requested another attempt.',rightAnswer:'RIGHT ANSWER',wrongAnswer:'WRONG ANSWER',randomizeAnswers:false,ruleChangedMessage:'Renee has changed the process. Try again.',wrongBecameRightMessage:'Wow, are you running my company now?',difficulty:2,success:'Task complete. Nothing meaningful has changed.',passed:false,isNew:true};tasks.push(task);save();render();openEdit(task)}
function deleteTask(t){if(!t)return;const ok=confirm(`Delete “${t.name}” from ${t.room}?\n\nThis cannot be undone unless you previously exported the task list.`);if(!ok)return;tasks=tasks.filter(x=>x.id!==t.id);save();render()}
$('#addTask').onclick=addTask;
function run(list){queue=[...list];play(queue.shift())}$('#testRoom').onclick=()=>run(tasks.filter(t=>t.room===activeRoom));$('#testAll').onclick=()=>run(tasks);$('#resetProgress').onclick=()=>{tasks.forEach(t=>t.passed=false);save();render()};$('#search').oninput=render;$('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(tasks,null,2)],{type:'application/json'}));a.download='chocolate-accidents-tasks.json';a.click();URL.revokeObjectURL(a.href)};$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data))throw Error();tasks=data;save();render()}catch{alert('That task JSON could not be imported.')}};r.readAsText(f)};
addEventListener('keydown',e=>{if(e.code==='Space'&&$('#playDialog').open&&activeTask){e.preventDefault();if(activeTask.type==='timing'&&state.stop)state.stop();if(activeTask.type==='hold')state.held=true}});addEventListener('keyup',e=>{if(e.code==='Space')state.held=false});render();
</script></body></html>
